name: Validate and build Frozen Throne card API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch immutable launch CardDefs snapshot
        run: |
          git init /tmp/hsdata
          git -C /tmp/hsdata remote add origin https://github.com/HearthSim/hsdata.git
          git -C /tmp/hsdata fetch --depth=1 origin 6f874a2b18045ed3464983aff85ca106bc656916
          git -C /tmp/hsdata show 6f874a2b18045ed3464983aff85ca106bc656916:CardDefs.xml > /tmp/CardDefs.xml
      - name: Inspect original CardDefs records
        run: python tools/probe-icc-carddefs.py /tmp/CardDefs.xml
      - name: Migrate all 182 cards to dated schema
        run: python tools/migrate-icc-to-v2.py /tmp/CardDefs.xml
      - name: Extract all 182 launch names and card text in koKR/enUS
        run: python tools/extract-icc-launch-strings.py /tmp/CardDefs.xml
      - name: Apply launch strings and canonical initial-state corrections
        run: python tools/apply-icc-launch-strings.py
      - name: Fetch and verify immutable before/after CardDefs archive snapshots
        run: |
          COMMITS="c623eb10a6fed4a214cf27923e749da9cb52c226 d399871096675e4186c1c2d35b9c410464a4ffbf 1fdd42edae20fe2c5477776a8bb0d0e2a209a5ac 0565689bc30e7fe550053066d033958f1f90033f e6b9c5e51678d5035d1188f63c246326bb221c60 0a387d653f339297339625710e4df91f0c62b67b 1a0dcda07394c622066630e4d09817aca8ff9fbf 62cc0f00dbed73f2d48ccefca6f611e6f8898986 fdad346dc49ebb5465f548a0a2b58b59edcbe087"
          git -C /tmp/hsdata fetch --depth=1 origin $COMMITS
          for commit in $COMMITS; do
            git -C /tmp/hsdata show "$commit:CardDefs.xml" > "/tmp/CardDefs-$commit.xml"
          done
          python tools/apply-icc-observation-events.py /tmp
      - name: Fetch and synchronize original native Tag transitions for the existing 111 events
        run: |
          COMMITS="beaa46cc24c1332ad91d4f7ae096024f6ff7d394 54141c4a6bf3efeedaf69d7510b987f216ff00e6 48f9590ce66d87b30530b411ed7fe18a0fa10db1 9e10b526eed8a9c5ece2f73f0c2a6a3b60109d62 6f874a2b18045ed3464983aff85ca106bc656916 058d33b9a62ccdff537bb9e43ccefdd19ed77f40 e6b9c5e51678d5035d1188f63c246326bb221c60 0a387d653f339297339625710e4df91f0c62b67b d399871096675e4186c1c2d35b9c410464a4ffbf 1a0dcda07394c622066630e4d09817aca8ff9fbf"
          git -C /tmp/hsdata fetch --depth=1 origin $COMMITS
          for commit in $COMMITS; do
            git -C /tmp/hsdata show "$commit:CardDefs.xml" > "/tmp/CardDefs-$commit.xml"
          done
          python tools/apply-icc-native-tags.py /tmp
      - name: Restore historical source evidence and card verification metadata
        run: |
          git fetch --depth=1 origin 9dd6b844daa08ceffd171e090e001ae3de36c3ec
          python tools/enrich-icc-source-evidence.py 9dd6b844daa08ceffd171e090e001ae3de36c3ec
      - name: Verify stable metadata against pre-migration sources
        run: |
          git fetch --depth=1 origin 9dd6b844daa08ceffd171e090e001ae3de36c3ec
          python tools/capture-legacy-metadata.py 9dd6b844daa08ceffd171e090e001ae3de36c3ec
      - name: Test history operations
        run: python -m unittest discover -s tests -v
      - name: Build schema-1 compatibility API indexes
        run: python tools/build-api.py
      - name: Commit migrated card sources and baseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards.json render.json history.json data/*.json sources/*.json
          if git diff --cached --quiet; then
            echo "No card source changes."
            exit 0
          fi
          git commit -m "Migrate Frozen Throne cards to dated schema v2"
          git push origin HEAD:main
